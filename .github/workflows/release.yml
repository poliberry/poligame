name: Release

on:
  push:
    branches:
      - main

  # Manual trigger option
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    env:
      CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
      VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
      VITE_NOVU_APP_ID: ${{ secrets.VITE_NOVU_APP_ID }}
      VITE_DISCORD_CLIENT_ID: ${{ secrets.VITE_DISCORD_CLIENT_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            arch: 'aarch64'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            arch: 'x86_64'
          - platform: 'ubuntu-22.04'
            args: '--bundles appimage'
            arch: 'x64'
          - platform: 'windows-latest'
            args: ''
            arch: 'x64'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav

      - name: Install frontend dependencies
        run: npm install

      - name: Get version
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          includeRelease: false
          includeUpdaterJson: false

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          ARCH="${{ matrix.arch }}"

          # Collect from both native and cross-compilation target paths
          for file in src-tauri/target/release/bundle/*/* src-tauri/target/*/release/bundle/*/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")

              # macOS .app.tar.gz has no version or arch — rename to include arch so
              # aarch64 and x86_64 artifacts don't overwrite each other when merged.
              if [[ "$filename" == "PoliGame.app.tar.gz" || "$filename" == "PoliGame.app.tar.gz.sig" ]]; then
                ext="${filename#PoliGame.app}"
                newname="PoliGame_${ARCH}.app${ext}"
              else
                newname="${filename//_0.0.0/_${VERSION}}"
              fi

              cp "$file" "release-assets/$newname"
            fi
          done

          ls -la release-assets/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*
          retention-days: 1

  publish-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-assets-*
          merge-multiple: true

      - name: List downloaded assets
        run: ls -la release-assets/

      - name: Generate updater JSON
        id: updater
        shell: bash
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          BASE="https://github.com/poliberry/poligame/releases/download/v${VERSION}"

          cat > release-assets/latest.json << EOF
          {
            "version": "$VERSION",
            "notes": "See full release notes at https://github.com/poliberry/poligame/releases/tag/v$VERSION",
            "pub_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "platforms": {
              "darwin-aarch64": {
                "signature": "$MACOS_AARCH64_SIG",
                "url": "https://github.com/poliberry/poligame/releases/download/v$VERSION/$MACOS_AARCH64"
              },
              "darwin-x86_64": {
                "signature": "$MACOS_X86_64_SIG",
                "url": "https://github.com/poliberry/poligame/releases/download/v$VERSION/$MACOS_X86_64"
              },
              "linux-x86_64": {
                "signature": "$LINUX_SIG",
                "url": "https://github.com/poliberry/poligame/releases/download/v$VERSION/$LINUX"
              },
              "windows-x86_64": {
                "signature": "$WINDOWS_SIG",
                "url": "https://github.com/poliberry/poligame/releases/download/v$VERSION/$WINDOWS"
              }
            }
          }
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ needs.release.outputs.version }}
          name: Release v${{ needs.release.outputs.version }}
          body: |
            ## PoliGame v${{ needs.release.outputs.version }}

            Version bump.
          files: |
            release-assets/*.msi
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.tar.gz
            release-assets/*.sig
            release-assets/latest.json
          draft: false
          prerelease: false

      - name: Update latest.json in repo
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('release-assets/latest.json', 'base64');

            let sha;
            try {
              const { data } = await github.rest.repos.getContent({
                owner: 'poliberry',
                repo: 'poligame',
                path: 'latest.json',
              });
              sha = data.sha;
            } catch (e) {
              // File doesn't exist yet
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: 'poliberry',
              repo: 'poligame',
              path: 'latest.json',
              message: `Update latest.json for v${{ needs.release.outputs.version }}`,
              content: content,
              sha: sha,
            });
