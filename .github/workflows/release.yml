name: Release to Public Repo

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'  # Also trigger on version tags
  
  # Manual trigger option
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    env:
      CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
      VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
      VITE_NOVU_APP_ID: ${{ secrets.VITE_NOVU_APP_ID }}
      VITE_DISCORD_CLIENT_ID: ${{ secrets.VITE_DISCORD_CLIENT_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            arch: 'aarch64'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            arch: 'x64'
          - platform: 'ubuntu-22.04'
            args: '--bundles appimage'
            arch: 'x64'
          - platform: 'windows-latest'
            args: ''
            arch: 'x64'

    runs-on: ${{ matrix.platform }}

    steps:
      # Checkout private repo code
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Setup Rust
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Install Linux dependencies
      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav

      # Install dependencies
      - name: Install frontend dependencies
        run: npm install

      # Get version from package.json or tag
      - name: Get version
        id: get_version
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Build Tauri app
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}

      # Prepare assets for release
      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          
          # Find and rename artifacts with version
          for file in src-tauri/target/release/bundle/*/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              # Add version to filename
              newname="${filename//_0.0.0/_${{ steps.get_version.outputs.VERSION }}}"
              cp "$file" "release-assets/$newname"
            fi
          done
          
          ls -la release-assets/

      # Upload artifacts temporarily
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*
          retention-days: 1

  # Create release in public repo with all assets
  publish-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-assets-*
          merge-multiple: true

      - name: List downloaded assets
        run: ls -la release-assets/

      # Generate updater JSON if using Tauri updater
      - name: Generate updater JSON
        id: updater
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          
          # Create latest.json for Tauri updater
          cat > release-assets/latest.json << EOF
          {
            "version": "$VERSION",
            "notes": "See full release notes at https://github.com/poliberry/poligame-releases/releases/tag/v$VERSION",
            "pub_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "platforms": {
              "darwin-aarch64": {
                "signature": "$(cat release-assets/*aarch64.app.tar.gz.sig 2>/dev/null || echo '')",
                "url": "https://github.com/poliberry/poligame-releases/releases/download/v$VERSION/app-$VERSION-aarch64.app.tar.gz"
              },
              "darwin-x86_64": {
                "signature": "$(cat release-assets/*x86_64.app.tar.gz.sig 2>/dev/null || echo '')",
                "url": "https://github.com/poliberry/poligame-releases/releases/download/v$VERSION/app-$VERSION-x86_64.app.tar.gz"
              },
              "linux-x86_64": {
                "signature": "$(cat release-assets/*.AppImage.tar.gz.sig 2>/dev/null || echo '')",
                "url": "https://github.com/poliberry/poligame-releases/releases/download/v$VERSION/app-$VERSION-x86_64.AppImage.tar.gz"
              },
              "windows-x86_64": {
                "signature": "$(cat release-assets/*x64-setup.exe.sig 2>/dev/null || echo '')",
                "url": "https://github.com/poliberry/poligame-releases/releases/download/v$VERSION/app-$VERSION-x64-setup.exe"
              }
            }
          }
          EOF

      # Create release in PUBLIC releases repo
      - name: Create Release in Public Repo
        uses: softprops/action-gh-release@v1
        with:
          repository: poliberry/poligame-releases  # Your public releases repo
          token: ${{ secrets.RELEASES_TOKEN }}  # PAT with access to releases repo
          tag_name: v${{ needs.release.outputs.version }}
          name: Release v${{ needs.release.outputs.version }}
          body: |
            ## What's Changed
            
            This release was automatically built from the private source repository.
            
            ### Installation
            
            Download the appropriate installer for your platform:
            - **Windows**: `.msi` or `.exe` installer
            - **macOS**: `.dmg` or `.app.tar.gz` (universal binary)
            - **Linux**: `.AppImage` or `.deb`
            
            ### Auto-Update
            
            This release supports automatic updates. The app will check for updates on launch.
            
            ### Checksums
            
            See attached `.sig` files for signature verification.
          files: |
            release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}

      # Update latest.json in releases repo (for Tauri updater)
      - name: Update latest.json in releases repo
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASES_TOKEN }}
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('release-assets/latest.json', 'base64');
            
            // Get the SHA of existing latest.json if it exists
            let sha;
            try {
              const { data } = await github.rest.repos.getContent({
                owner: 'poliberry',
                repo: 'poligame-releases',
                path: 'latest.json',
              });
              sha = data.sha;
            } catch (e) {
              // File doesn't exist yet
            }
            
            // Create or update latest.json
            await github.rest.repos.createOrUpdateFileContents({
              owner: 'poliberry',
              repo: 'poligame-releases',
              path: 'latest.json',
              message: `Update latest.json for v${{ needs.release.outputs.version }}`,
              content: content,
              sha: sha,
            });