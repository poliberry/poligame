name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

  # Manual trigger option
  workflow_dispatch:

jobs:
  release:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    env:
      CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
      VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
      VITE_NOVU_APP_ID: ${{ secrets.VITE_NOVU_APP_ID }}
      VITE_DISCORD_CLIENT_ID: ${{ secrets.VITE_DISCORD_CLIENT_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            arch: 'aarch64'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            arch: 'x64'
          - platform: 'ubuntu-22.04'
            args: '--bundles appimage'
            arch: 'x64'
          - platform: 'windows-latest'
            args: ''
            arch: 'x64'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav

      - name: Install frontend dependencies
        run: npm install

      - name: Get version
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          # Search all target directories so cross-compiled macOS bundles are included
          find src-tauri/target -path "*/release/bundle/*/*" -type f -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*
          retention-days: 1

  publish-release:
    needs: release
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-assets-*
          merge-multiple: true

      - name: List downloaded assets
        run: ls -la release-assets/

      - name: Generate updater JSON
        id: updater
        shell: bash
        run: |
          VERSION="${{ needs.release.outputs.version }}"

          # Discover actual artifact filenames to build correct download URLs
          MACOS_AARCH64=$(ls release-assets/*aarch64.app.tar.gz 2>/dev/null | head -1 | xargs -I{} basename {} 2>/dev/null || echo '')
          MACOS_AARCH64_SIG=$(cat release-assets/*aarch64.app.tar.gz.sig 2>/dev/null || echo '')
          MACOS_X86_64=$(ls release-assets/*x86_64.app.tar.gz 2>/dev/null | head -1 | xargs -I{} basename {} 2>/dev/null || echo '')
          MACOS_X86_64_SIG=$(cat release-assets/*x86_64.app.tar.gz.sig 2>/dev/null || echo '')
          LINUX=$(ls release-assets/*.AppImage.tar.gz 2>/dev/null | head -1 | xargs -I{} basename {} 2>/dev/null || echo '')
          LINUX_SIG=$(cat release-assets/*.AppImage.tar.gz.sig 2>/dev/null || echo '')
          WINDOWS=$(ls release-assets/*x64-setup.exe 2>/dev/null | head -1 | xargs -I{} basename {} 2>/dev/null || echo '')
          WINDOWS_SIG=$(cat release-assets/*x64-setup.exe.sig 2>/dev/null || echo '')

          cat > release-assets/latest.json << EOF
          {
            "version": "$VERSION",
            "notes": "See full release notes at https://github.com/poliberry/poligame/releases/tag/v$VERSION",
            "pub_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "platforms": {
              "darwin-aarch64": {
                "signature": "$MACOS_AARCH64_SIG",
                "url": "https://github.com/poliberry/poligame/releases/download/v$VERSION/$MACOS_AARCH64"
              },
              "darwin-x86_64": {
                "signature": "$MACOS_X86_64_SIG",
                "url": "https://github.com/poliberry/poligame/releases/download/v$VERSION/$MACOS_X86_64"
              },
              "linux-x86_64": {
                "signature": "$LINUX_SIG",
                "url": "https://github.com/poliberry/poligame/releases/download/v$VERSION/$LINUX"
              },
              "windows-x86_64": {
                "signature": "$WINDOWS_SIG",
                "url": "https://github.com/poliberry/poligame/releases/download/v$VERSION/$WINDOWS"
              }
            }
          }
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ needs.release.outputs.version }}
          name: Release v${{ needs.release.outputs.version }}
          body: |
            ## PoliGame v${{ needs.release.outputs.version }}

            ### What's New

            #### Custom Themes System
            - Full YAML-based theme system — create, install, and switch between themes from Settings → Themes
            - Two built-in themes ship with this release: **PoliGame Dark** and **PoliGame Light**
            - Default dark theme uses the PoliGame brand palette: mint accent (`#4CE4B1`), deep teal buttons (`#006B4F`)
            - Light theme uses slightly lighter variants of the same palette
            - Themes live in your local app data folder (`%APPDATA%\PoliGame\themes\` on Windows) — open the folder from the Themes gallery to add your own
            - Theme editor built-in: customise colors, font family, border radius, and library background image
            - Official themes update automatically on each launch to stay current

            #### App-Wide Theme Integration
            - **Google Sans Flex** is now the global font, loaded once and applied via the theme system — custom themes can override it
            - All hardcoded font references (Livvic, Unbounded, per-component Google Fonts `<link>` tags) removed; everything inherits from the theme
            - Overdrive gamepad mode now fully theme-aware: focus rings, active states, and accent colors all respond to the active theme accent color
            - Scrollbars, buttons, sliders, and prose elements use theme CSS variables throughout
            - New `.theme-btn` utility applies the button background/foreground hover-swap automatically

            ### Installation

            Download the appropriate installer for your platform:
            - **Windows**: `.msi` or `.exe` installer
            - **macOS**: `.dmg` or `.app.tar.gz`
            - **Linux**: `.AppImage` or `.deb`

            ### Auto-Update

            This release supports automatic updates. The app will notify you when a newer version is available.

            ### Checksums

            See attached `.sig` files for signature verification.
          files: |
            release-assets/*
          draft: false
          prerelease: false

      - name: Update latest.json in repo
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('release-assets/latest.json', 'base64');

            let sha;
            try {
              const { data } = await github.rest.repos.getContent({
                owner: 'poliberry',
                repo: 'poligame',
                path: 'latest.json',
              });
              sha = data.sha;
            } catch (e) {
              // File doesn't exist yet
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: 'poliberry',
              repo: 'poligame',
              path: 'latest.json',
              message: `Update latest.json for v${{ needs.release.outputs.version }}`,
              content: content,
              sha: sha,
            });
