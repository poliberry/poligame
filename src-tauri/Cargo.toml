[package]
name = "poligame"
version = "1.0.3"
description = "Game aggregator with marketplace"
authors = ["poliberry"]
license = ""
repository = ""
edition = "2021"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-updater = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.21"
reqwest = { version = "0.11", features = ["json"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
vdf = "0.1"
dotenv = "0.15"
urlencoding = "2.1"
sysinfo = "0.30"
dirs = "6.0.0"
tauri-plugin-devtools = "2.1.0"
tauri-plugin-global-shortcut = "2.0"
discord-rich-presence = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]

# Windows-only dependencies
[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = ["Win32_System_Registry", "Win32_Foundation"] }
winreg = "0.52"
