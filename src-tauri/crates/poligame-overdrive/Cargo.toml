[package]
name = "poligame-overdrive"
version = "1.3.5"
edition = "2021"
description = "Overdrive fullscreen game launcher for PoliGame"
authors = ["poliberry"]

[[bin]]
name = "poligame-overdrive"
path = "src/main.rs"

[dependencies]
# gpui = "0.2"  # Re-enable when implementing the full render layer (API stub in src/ui/mod.rs)
gilrs = "0.10"
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
dirs = "6.0.0"
