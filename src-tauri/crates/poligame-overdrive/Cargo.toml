[package]
name = "poligame-overdrive"
version = "1.3.5"
edition = "2021"
description = "Overdrive fullscreen game launcher for PoliGame"
authors = ["poliberry"]

[[bin]]
name = "poligame-overdrive"
path = "src/main.rs"

[dependencies]
gilrs = "0.10"
ratatui = "0.27"
crossterm = "0.27"
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
dirs = "6.0.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }
