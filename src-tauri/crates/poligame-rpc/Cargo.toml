[package]
name = "poligame-rpc"
version = "1.3.5"
edition = "2021"
description = "Discord Rich Presence helper process for PoliGame"
authors = ["poliberry"]

[[bin]]
name = "poligame-rpc"
path = "src/main.rs"

[dependencies]
discord-rich-presence = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
anyhow = "1.0"
