[package]
name = "poligame-overlay"
version = "1.3.5"
edition = "2021"
description = "In-game overlay for PoliGame (standard + Overdrive panel)"
authors = ["poliberry"]

[[bin]]
name = "poligame-overlay"
path = "src/main.rs"

[dependencies]
gilrs = "0.10"
ratatui = "0.27"
crossterm = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
] }
