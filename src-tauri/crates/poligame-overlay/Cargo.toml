[package]
name = "poligame-overlay"
version = "1.3.5"
edition = "2021"
description = "In-game overlay for PoliGame (standard + Overdrive panel)"
authors = ["poliberry"]

[[bin]]
name = "poligame-overlay"
path = "src/main.rs"

[dependencies]
# gpui = "0.2"  # Re-enable when implementing the full render layer (API stub in src/ui/mod.rs)
gilrs = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
] }
